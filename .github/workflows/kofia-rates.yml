# 금투협 채권시가평가수익률(평가사 평균) 받아 두기.
#
# 환율과 같은 이유다 — 브라우저는 kofiabond 를 직접 부를 수 없다(CORS).
# 여기서 받아 저장소에 커밋하고, 앱은 저장소 안의 JSON 만 읽는다.
name: 이자율 받기

on:
  schedule:
    # 매 영업일 10:10 UTC = 19:10 KST. 그날 시가평가수익률이 고시된 뒤다.
    - cron: '10 10 * * 1-5'
  workflow_dispatch:
    inputs:
      years:
        description: '최근 몇 년치를 받을지'
        required: false
        default: '3'

permissions:
  contents: write

concurrency:
  group: kofia-rates
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 정기 실행은 최근 2주만 확인한다. 같은 날짜가 다시 오면 새로 받은 값으로 바뀐다.
      - name: 이자율 받기
        run: |
          python3 scripts/fetch_kofia_rates.py \
            ${{ github.event_name == 'schedule' && '--days 14' || format('--years {0}', inputs.years || '3') }}

      - name: 바뀐 것이 있으면 커밋
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A src/data/rates
          if git diff --cached --quiet -- src/data/rates; then
            echo "바뀐 이자율 없음 — 커밋하지 않는다."
            exit 0
          fi
          git commit -m "chore(rates): 이자율 자료 갱신 ($(date -u +%Y-%m-%d))"
          branch='${{ github.ref_name }}'
          for attempt in 1 2 3 4 5; do
            git pull --rebase -X theirs origin "$branch"
            if git push origin "HEAD:$branch"; then
              exit 0
            fi
            echo "푸시 거부 — ${attempt}번째, 잠시 뒤 다시 시도한다."
            sleep $((attempt * 5))
          done
          echo "::error::다섯 번 시도했지만 푸시하지 못했다."
          exit 1
