# 금투협 채권정보센터 신용등급 정찰 — 회사 신용등급 조회 서비스를 찾는다 (임시).
# 받은 화면 정의와 응답을 .probe/cdt/ 에 커밋해 두고 읽는다. 정찰이 끝나면 통째로 지운다.
name: 신용등급 정찰

on:
  push:
    branches: [claude/intelligent-lovelace-mxxc4l]
    paths: [scripts/probe_kofia_ratings.py, .github/workflows/kofia-ratings-probe.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/probe_kofia_ratings.py > probe.txt 2>&1 || true
      - run: |
          mkdir -p .probe/cdt && mv probe.txt .probe/cdt/
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A .probe
          git commit -m "chore(ratings): 신용등급 정찰 결과 (임시)" || exit 0
          for attempt in 1 2 3; do
            git pull --rebase origin '${{ github.ref_name }}' && git push origin "HEAD:${{ github.ref_name }}" && exit 0
            sleep $((attempt * 5))
          done
          exit 1
